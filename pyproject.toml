[project]
name = "retail-tide"
version = "0.1.0"
description = "Multi-platform retail-investor sentiment observatory and event-study system"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "alembic>=1.13",
  "curl-cffi>=0.15.0,<0.16",
  "fastapi>=0.100",
  "httpx>=0.24",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
retail-tide = "retail_tide.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_tide"]

[tool.hatch.build.targets.sdist]
exclude = ["/.agents", "/.claude", "/.codex", "/.opencode", "/var"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
