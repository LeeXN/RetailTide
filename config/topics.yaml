xiaohongshu_discovery:
  # Xiaohongshu has no reliable boolean-OR query. Run these as separate,
  # newest-first searches, union candidates by note ID before detail requests,
  # then let the entity resolver attach zero, one, or multiple tracks.
  queries: [投资, 股票, ETF, 基金, 持仓, 散户]
  daily_max_pages: 1
  historical_max_pages: 20

topics:
  - slug: gold
    name: 黄金
    status: active
    aliases: [gold, 黄金, 金价, 黄金ETF, 贵金属, gold etf]
    source_queries:
      zhihu: 黄金 股票 ETF 金价
      xiaohongshu: 黄金 金价 ETF 投资
      wikimedia-pageviews: 黄金
    source_query_variants:
      xiaohongshu: [黄金ETF 金价走势, 买黄金ETF 散户, 黄金 加仓 止盈, 金价 回调 投资]
    # The gold board is exceptionally noisy. Use Eastmoney's own paginated
    # "热门" feed, retain the requested publication-date filter, and stop at a
    # declared sample budget instead of treating thousands of latest posts as
    # a complete population.
    source_strategies:
      guba:
        mode: hot
        max_items: 200
  - slug: broad-a-share
    name: A股大盘
    status: active
    aliases: [A股大盘, 大盘, 上证指数, 沪指, CSI300]
    source_queries:
      guba: zssh000001
      zhihu: A股 大盘 股票 投资
      xiaohongshu: A股 大盘 散户 股票
      wikimedia-pageviews: 上海证券交易所综合股价指数
    source_query_variants:
      xiaohongshu: [A股 散户 大盘, 上证指数 股市, 股票 亏钱 回本, A股 加仓 清仓]
    # The broad-market board is much more active than a normal thematic board.
    # A 90-day backfill can exceed 3,000 pages on this high-volume board.
    source_max_pages:
      guba: 5000
  - slug: nasdaq
    name: 纳斯达克
    status: active
    aliases: [纳斯达克, Nasdaq, NASDAQ, 纳指]
